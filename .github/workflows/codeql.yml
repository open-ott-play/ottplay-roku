name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '29 8 * * 2'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  scan:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@77b0157695fb80e4d97c3ac4819c2d1db7ba96c7 # main
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: actions,javascript-typescript,python
      force-full: true
      run-codeql: true
      run-trivy: false
      run-dependency-review: false
