name: Release Roku sideload ZIP

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: roku-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run verify
      - run: node scripts/release-check.cjs
      - name: Publish verified sideload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/ottplay-roku-sideload.zip dist/SHA256SUMS dist/release.json \
            --verify-tag --title "OTTPlay for Roku $RELEASE_TAG" \
            --notes "Unsigned BrightScript/SceneGraph developer sideload ZIP. Validated by compiler, helper tests and deterministic packaging. Physical Roku playback has not been tested; this is not a signed .pkg or a Roku-hosted beta channel. See the repository installation guide." \
            "${args[@]}"
