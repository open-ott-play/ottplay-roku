name: Release Roku sideload ZIP

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: roku-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run verify
      - run: node scripts/release-check.cjs
      - name: Publish verified sideload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/ottplay-roku-sideload.zip dist/SHA256SUMS dist/release.json \
            --verify-tag --title "OTTPlay for Roku $RELEASE_TAG" \
            --notes "Unsigned BrightScript/SceneGraph developer sideload ZIP. Validated by compiler, helper tests and deterministic packaging. Physical Roku playback has not been tested; this is not a signed .pkg or a Roku-hosted beta channel. See the repository installation guide." \
            "${args[@]}"
