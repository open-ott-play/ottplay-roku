name: Validate Roku app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roku-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BrightScript and package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.22.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify complete change
        id: scope
        run: python3 scripts/change_scope.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.scope.outputs.run != 'false' || steps.scope.outputs.reason != 'documentation-only'
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.scope.outputs.run != 'false' || steps.scope.outputs.reason != 'documentation-only'
        with:
          python-version: '3.12'
      - if: steps.scope.outputs.run != 'false' || steps.scope.outputs.reason != 'documentation-only'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: steps.scope.outputs.run != 'false' || steps.scope.outputs.reason != 'documentation-only'
        run: npm audit --audit-level=moderate
      - if: steps.scope.outputs.run != 'false' || steps.scope.outputs.reason != 'documentation-only'
        run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.scope.outputs.run != 'false' || steps.scope.outputs.reason != 'documentation-only'
        with:
          name: roku-sideload-node-${{ matrix.node }}
          path: |
            dist/ottplay-roku-sideload.zip
            dist/SHA256SUMS
            dist/release.json
          if-no-files-found: error
      - name: Report documentation-only result
        if: steps.scope.outputs.run == 'false' && steps.scope.outputs.reason == 'documentation-only'
        run: echo 'Documentation-only change; BrightScript, dependency and package qualification were not exercised.'
